name: Build Executables

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install pyinstaller customtkinter packaging pillow numpy opencv-python-headless
          
      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "TAS_GUI" --add-data "src/ui;src/ui" --hidden-import=tkinter --hidden-import=PIL src/ui/app.py
          
      - name: Upload Windows Artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/TAS_GUI.exe
          asset_name: TAS_GUI_Windows.exe
          asset_content_type: application/vnd.microsoft.portable-executable

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install pyinstaller customtkinter packaging pillow numpy opencv-python-headless
          
      - name: Build App
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "TAS_GUI" --add-data "src/ui:src/ui" --hidden-import=tkinter --hidden-import=PIL src/ui/app.py
          
      - name: Zip Mac App
        run: zip -rj TAS_GUI_MacOS.zip dist/TAS_GUI.app
        
      - name: Upload Mac Artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./TAS_GUI_MacOS.zip
          asset_name: TAS_GUI_MacOS.zip
          asset_content_type: application/zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install pyinstaller customtkinter packaging pillow numpy opencv-python-headless
          
      - name: Build AppImage (simplified as binary)
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "TAS_GUI" --add-data "src/ui:src/ui" --hidden-import=tkinter --hidden-import=PIL src/ui/app.py
          
      - name: Zip Linux Binary
        run: zip -j TAS_GUI_Linux.zip dist/TAS_GUI
        
      - name: Upload Linux Artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./TAS_GUI_Linux.zip
          asset_name: TAS_GUI_Linux.zip
          asset_content_type: application/zip
